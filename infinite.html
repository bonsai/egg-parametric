<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>卵パラメトリック</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; touch-action: none; font-family: 'Segoe UI', system-ui, sans-serif; }
        #c { display: block; width: 100vw; height: 100vh; }

        /* Toggle button */
        #toggle { position: fixed; top: 16px; right: 16px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 1.2rem; cursor: pointer; backdrop-filter: blur(8px); }
        #toggle:active { transform: scale(0.9); }

        /* Panel */
        #panel { position: fixed; top: 0; right: 0; width: 340px; max-width: 85vw; height: 100vh; background: rgba(10,10,24,0.92); backdrop-filter: blur(20px); border-left: 1px solid rgba(255,255,255,0.08); z-index: 20; transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        #panel.open { transform: translateX(0); }
        .p-header { padding: 20px 20px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .p-header h2 { font-size: 1.1rem; color: #ffd93d; margin-bottom: 4px; }
        .p-header p { font-size: 0.78rem; color: #666; }
        .p-body { padding: 16px 20px; flex: 1; }

        /* Param card */
        .param { margin-bottom: 16px; padding: 14px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); transition: border-color 0.2s; }
        .param:hover { border-color: rgba(255,217,61,0.2); }
        .param-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .param-label { font-size: 0.85rem; color: #ccc; }
        .param-label small { color: #666; font-size: 0.75rem; }
        .param-val { font-family: 'SF Mono', monospace; font-size: 0.85rem; color: #ffd93d; min-width: 40px; text-align: right; }
        .param input[type="range"] { width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); outline: none; -webkit-appearance: none; }
        .param input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #ffd93d; cursor: pointer; box-shadow: 0 0 10px rgba(255,217,61,0.3); transition: transform 0.15s; }
        .param input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.2); }
        .param-range { display: flex; justify-content: space-between; font-size: 0.7rem; color: #444; margin-top: 4px; }

        /* Presets */
        .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
        .preset { padding: 10px 6px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #aaa; font-size: 0.75rem; text-align: center; cursor: pointer; transition: all 0.2s; }
        .preset:hover, .preset.active { background: rgba(255,217,61,0.12); border-color: #ffd93d; color: #ffd93d; }
        .preset:active { transform: scale(0.95); }

        /* Bottom bar */
        .p-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.06); }
        .btn-row { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-rec { background: linear-gradient(135deg, #ff4444, #cc0000); color: white; }
        .btn-rec:disabled { opacity: 0.5; }
        .btn-dl { background: rgba(255,255,255,0.08); color: #ccc; display: none; }
        .btn-dl:hover { background: rgba(255,255,255,0.15); }
        .btn-share { background: rgba(255,217,61,0.15); color: #ffd93d; }

        /* Progress */
        #progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #ffd93d, #ff6b9d); z-index: 25; transition: width 0.1s; width: 0%; }
        #progress.active { animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* Status toast */
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; z-index: 30; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        #toast.show { opacity: 1; }

        /* Mobile */
        @media (max-width: 480px) {
            #panel { width: 100vw; }
        }
    </style>
</head>
<body>
    <div id="progress"></div>
    <div id="toast"></div>
    <canvas id="c"></canvas>
    <button id="toggle" onclick="togglePanel()">⚙</button>

    <div id="panel">
        <div class="p-header">
            <h2>卵パラメトリック</h2>
            <p>6つのパラメータで調整 → リアルタイム反映</p>
        </div>
        <div class="p-body">
            <div class="presets">
                <div class="preset active" onclick="applyPreset('calm')">穏やか</div>
                <div class="preset" onclick="applyPreset('vj')">VJ</div>
                <div class="preset" onclick="applyPreset('rave')">レイヴ</div>
                <div class="preset" onclick="applyPreset('zen')">禅</div>
                <div class="preset" onclick="applyPreset('pop')">ポップ</div>
                <div class="preset" onclick="applyPreset('dark')">ダーク</div>
            </div>

            <div class="param" id="p-count">
                <div class="param-top">
                    <span class="param-label">🥚 卵の数 <small>数</small></span>
                    <span class="param-val" id="v-count">6</span>
                </div>
                <input type="range" id="s-count" min="1" max="20" step="1" value="6" oninput="onParam()">
                <div class="param-range"><span>1</span><span>20</span></div>
            </div>

            <div class="param" id="p-size">
                <div class="param-top">
                    <span class="param-label">📐 サイズ <small>倍率</small></span>
                    <span class="param-val" id="v-size">1.0</span>
                </div>
                <input type="range" id="s-size" min="0.3" max="3.0" step="0.1" value="1.0" oninput="onParam()">
                <div class="param-range"><span>0.3</span><span>3.0</span></div>
            </div>

            <div class="param" id="p-float">
                <div class="param-top">
                    <span class="param-label">🌊 浮遊感 <small>速さ</small></span>
                    <span class="param-val" id="v-float">0.8</span>
                </div>
                <input type="range" id="s-float" min="0.1" max="3.0" step="0.1" value="0.8" oninput="onParam()">
                <div class="param-range"><span>ゆっくり</span><span>速い</span></div>
            </div>

            <div class="param" id="p-rotate">
                <div class="param-top">
                    <span class="param-label">🔄 回転 <small>速さ</small></span>
                    <span class="param-val" id="v-rotate">0.5</span>
                </div>
                <input type="range" id="s-rotate" min="0.0" max="3.0" step="0.1" value="0.5" oninput="onParam()">
                <div class="param-range"><span>止める</span><span>速い</span></div>
            </div>

            <div class="param" id="p-color">
                <div class="param-top">
                    <span class="param-label">🎨 色の変化 <small>速さ</small></span>
                    <span class="param-val" id="v-color">0.5</span>
                </div>
                <input type="range" id="s-color" min="0.0" max="3.0" step="0.1" value="0.5" oninput="onParam()">
                <div class="param-range"><span>固定</span><span>高速</span></div>
            </div>

            <div class="param" id="p-particle">
                <div class="param-top">
                    <span class="param-label">✨ パーティクル <small>量</small></span>
                    <span class="param-val" id="v-particle">150</span>
                </div>
                <input type="range" id="s-particle" min="0" max="500" step="10" value="150" oninput="onParam()">
                <div class="param-range"><span>なし</span><span>500</span></div>
            </div>
        </div>

        <div class="p-footer">
            <div class="btn-row">
                <button class="btn btn-rec" id="recBtn" onclick="startRec()">● 録画 15s</button>
                <button class="btn btn-dl" id="dlBtn" onclick="download()">↓ DL</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    (() => {
        'use strict';

        // ── State ──────────────────────────────────────────────
        const P = { count: 6, size: 1.0, float: 0.8, rotate: 0.5, color: 0.5, particle: 150 };
        const W = 1080, H = 1920, DUR = 15, FPS = 30;

        // ── Three ──────────────────────────────────────────────
        const canvas = document.getElementById('c');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a18);

        const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
        camera.position.set(0, 2, 6);

        scene.add(new THREE.AmbientLight(0x404060, 0.6));
        const dl1 = new THREE.DirectionalLight(0xffffff, 1.2);
        dl1.position.set(3, 8, 5);
        scene.add(dl1);
        const dl2 = new THREE.DirectionalLight(0xffd93d, 0.4);
        dl2.position.set(-4, 3, -3);
        scene.add(dl2);
        const pl = new THREE.PointLight(0xff6b9d, 0.6, 15);
        pl.position.set(0, -2, 4);
        scene.add(pl);

        // ── Egg builder ────────────────────────────────────────
        function makeEgg(r, h, sharp, segs) {
            const v = [], idx = [];
            for (let i = 0; i <= segs; i++) {
                const phi = Math.PI * i / segs;
                for (let j = 0; j < segs; j++) {
                    const th = 2 * Math.PI * j / segs;
                    let R = r, y = h * Math.cos(phi);
                    if (y > 0) R *= 1.0 - (y / h) * sharp;
                    v.push(R * Math.sin(phi) * Math.cos(th), y, R * Math.sin(phi) * Math.sin(th));
                }
            }
            for (let i = 0; i < segs; i++)
                for (let j = 0; j < segs; j++) {
                    const a = i*segs+j, b = i*segs+(j+1)%segs;
                    const c = (i+1)*segs+(j+1)%segs, d = (i+1)*segs+j;
                    idx.push(a,b,c, a,c,d);
                }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
            geo.setIndex(idx);
            geo.computeVertexNormals();
            return geo;
        }

        const palettes = [
            [0xf5e6d3, 0xffd93d, 0xff6b9d, 0x6bcb77, 0x4ecdc4, 0xa8e6cf, 0xff8a5c, 0xea5455, 0x2d98da, 0xf8c291],
            [0xff0055, 0x00ff88, 0x5500ff, 0xffaa00, 0x00aaff, 0xff00aa, 0xaaff00, 0x00ffaa, 0xff5500, 0x55aaff],
            [0xffffff, 0xdddddd, 0xbbbbbb, 0x999999, 0xf0f0f0, 0xe8e8e8, 0xd0d0d0, 0xc0c0c0, 0xf5f5f5, 0xeaeaea],
            [0xff6b6b, 0xffa07a, 0xffd93d, 0x98fb98, 0x87ceeb, 0xdda0dd, 0xf0e68c, 0xffb6c1, 0x90ee90, 0xffdab9],
        ];

        let eggMeshes = [];
        let particleMesh = null;

        // ── Build scene from params ────────────────────────────
        function buildScene() {
            // Remove old eggs
            eggMeshes.forEach(m => scene.remove(m));
            eggMeshes = [];
            if (particleMesh) { scene.remove(particleMesh); particleMesh = null; }

            const { count, size, particle } = P;
            const pal = palettes[0];

            for (let i = 0; i < count; i++) {
                const r = (0.25 + Math.random() * 0.4) * size;
                const h = r * (1.2 + Math.random() * 0.4);
                const geo = makeEgg(r, h, 0.2 + Math.random() * 0.25, 20);
                const color = pal[i % pal.length];
                const mat = new THREE.MeshStandardMaterial({
                    color, roughness: 0.25 + Math.random() * 0.35, metalness: 0.1,
                });
                const mesh = new THREE.Mesh(geo, mat);
                const spread = 2 + count * 0.2;
                mesh.userData = {
                    baseY: -spread/2 + (i / Math.max(count-1, 1)) * spread,
                    baseX: (Math.random() - 0.5) * 4,
                    speed: 0.3 + Math.random() * 1.5,
                    phase: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 2,
                };
                mesh.position.set(mesh.userData.baseX, mesh.userData.baseY, 0);
                scene.add(mesh);
                eggMeshes.push(mesh);
            }

            // Particles
            if (particle > 0) {
                const pGeo = new THREE.BufferGeometry();
                const pPos = new Float32Array(particle * 3);
                for (let i = 0; i < particle; i++) {
                    pPos[i*3] = (Math.random() - 0.5) * 14;
                    pPos[i*3+1] = (Math.random() - 0.5) * 24;
                    pPos[i*3+2] = (Math.random() - 0.5) * 10;
                }
                pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
                const pMat = new THREE.PointsMaterial({ color: 0xffd93d, size: 0.06, transparent: true, opacity: 0.5 });
                particleMesh = new THREE.Points(pGeo, pMat);
                scene.add(particleMesh);
            }
        }

        buildScene();

        // ── Animate ────────────────────────────────────────────
        function animate(t) {
            const time = t / 1000;
            const { float, rotate, color: colorSpd } = P;

            eggMeshes.forEach(e => {
                const d = e.userData;
                e.position.y = d.baseY + Math.sin(time * d.speed * float + d.phase) * (0.5 + float * 0.5);
                e.position.x = d.baseX + Math.sin(time * d.speed * 0.5 * float + d.phase) * 0.4;
                e.rotation.y += d.rotSpeed * rotate * 0.015;
                e.rotation.x = Math.sin(time * 0.4 + d.phase) * 0.15;

                // Per-egg color shift
                if (colorSpd > 0) {
                    const hue = (time * colorSpd * 0.05 + d.phase / Math.PI / 2) % 1;
                    e.material.color.setHSL(hue, 0.7, 0.65);
                }
            });

            // Camera
            camera.position.x = Math.sin(time * 0.25) * 0.6;
            camera.position.y = 2 + Math.sin(time * 0.15) * 0.6;
            camera.lookAt(0, 0, 0);

            // Background
            if (colorSpd > 0) {
                const hue = (time * colorSpd * 0.02) % 1;
                scene.background.setHSL(hue, 0.35, 0.06);
                pl.color.setHSL((hue + 0.5) % 1, 0.8, 0.5);
            }

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // ── Param binding ──────────────────────────────────────
        window.onParam = function() {
            const keys = ['count', 'size', 'float', 'rotate', 'color', 'particle'];
            keys.forEach(k => {
                const el = document.getElementById('s-' + k);
                const vEl = document.getElementById('v-' + k);
                P[k] = parseFloat(el.value);
                vEl.textContent = k === 'count' || k === 'particle' ? Math.round(P[k]) : P[k].toFixed(1);
            });
            buildScene();
        };

        // ── Panel toggle ───────────────────────────────────────
        window.togglePanel = function() {
            document.getElementById('panel').classList.toggle('open');
        };

        // ── Presets ────────────────────────────────────────────
        const presetData = {
            calm:  { count: 5, size: 1.0, float: 0.4, rotate: 0.2, color: 0.2, particle: 80 },
            vj:    { count: 8, size: 0.8, float: 1.2, rotate: 1.5, color: 2.0, particle: 200 },
            rave:  { count: 15, size: 0.5, float: 2.5, rotate: 2.5, color: 3.0, particle: 400 },
            zen:   { count: 3, size: 1.5, float: 0.2, rotate: 0.1, color: 0.0, particle: 30 },
            pop:   { count: 10, size: 0.7, float: 1.5, rotate: 1.0, color: 1.5, particle: 150 },
            dark:  { count: 7, size: 1.2, float: 0.6, rotate: 0.4, color: 0.3, particle: 100 },
        };

        window.applyPreset = function(name) {
            const p = presetData[name];
            if (!p) return;
            Object.entries(p).forEach(([k, v]) => {
                document.getElementById('s-' + k).value = v;
            });
            onParam();
            document.querySelectorAll('.preset').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            toast(name.toUpperCase() + ' プリセット');
        };

        // ── Recording ──────────────────────────────────────────
        let recordedBlob = null;

        window.startRec = async function() {
            const btn = document.getElementById('recBtn');
            const bar = document.getElementById('progress');
            btn.textContent = '● 録画中...';
            btn.disabled = true;
            bar.style.width = '0%';
            bar.classList.add('active');

            const origW = window.innerWidth, origH = window.innerHeight;
            renderer.setSize(W, H);
            camera.aspect = W / H;
            camera.updateProjectionMatrix();

            const stream = canvas.captureStream(FPS);
            const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
            const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 });
            const chunks = [];
            rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            const done = new Promise(res => { rec.onstop = () => res(new Blob(chunks, { type: 'video/webm' })); });
            rec.start();

            const start = performance.now();
            await new Promise(resolve => {
                (function loop() {
                    const t = (performance.now() - start) / 1000;
                    bar.style.width = Math.min(t / DUR * 100, 100) + '%';
                    if (t >= DUR) { rec.stop(); resolve(); }
                    else requestAnimationFrame(loop);
                })();
            });

            recordedBlob = await done;
            renderer.setSize(origW, origH);
            camera.aspect = origW / origH;
            camera.updateProjectionMatrix();

            bar.classList.remove('active');
            btn.textContent = '● 録画 15s';
            btn.disabled = false;
            document.getElementById('dlBtn').style.display = 'inline-block';
            toast('録画完了！ ' + (recordedBlob.size / 1024 / 1024).toFixed(1) + 'MB');
        };

        window.download = function() {
            if (!recordedBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(recordedBlob);
            a.download = 'egg_' + Date.now() + '.webm';
            a.click();
        };

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        // Open panel on mobile by default
        if (window.innerWidth < 600) document.getElementById('panel').classList.add('open');
    })();
    </script>
</body>
</html>
