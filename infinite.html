<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>卵物理シミュレーション</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; touch-action: none; font-family: 'Segoe UI', system-ui, sans-serif; }
        #c { display: block; width: 100vw; height: 100vh; }

        #toggle { position: fixed; top: 16px; right: 16px; z-index: 30; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 1.2rem; cursor: pointer; backdrop-filter: blur(8px); }

        #panel { position: fixed; top: 0; right: 0; width: 340px; max-width: 85vw; height: 100vh; background: rgba(10,10,24,0.92); backdrop-filter: blur(20px); border-left: 1px solid rgba(255,255,255,0.08); z-index: 20; transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        #panel.open { transform: translateX(0); }
        .p-header { padding: 20px 20px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .p-header h2 { font-size: 1.1rem; color: #ffd93d; margin-bottom: 4px; }
        .p-header p { font-size: 0.78rem; color: #666; }
        .p-body { padding: 16px 20px; flex: 1; }

        .section-label { font-size: 0.7rem; color: #555; text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 8px; }

        /* Type selector */
        .type-row { display: flex; gap: 8px; margin-bottom: 16px; }
        .type-btn { flex: 1; padding: 14px 8px; background: rgba(255,255,255,0.04); border: 2px solid rgba(255,255,255,0.08); border-radius: 12px; color: #aaa; font-size: 0.8rem; text-align: center; cursor: pointer; transition: all 0.2s; }
        .type-btn .icon { font-size: 1.6rem; display: block; margin-bottom: 4px; }
        .type-btn:hover { border-color: rgba(255,217,61,0.3); }
        .type-btn.active { background: rgba(255,217,61,0.12); border-color: #ffd93d; color: #ffd93d; }
        .type-btn:active { transform: scale(0.95); }

        /* Param card */
        .param { margin-bottom: 14px; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid rgba(255,255,255,0.06); }
        .param-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .param-label { font-size: 0.82rem; color: #ccc; }
        .param-val { font-family: 'SF Mono', monospace; font-size: 0.82rem; color: #ffd93d; }
        .param input[type="range"] { width: 100%; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); outline: none; -webkit-appearance: none; }
        .param input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #ffd93d; cursor: pointer; box-shadow: 0 0 8px rgba(255,217,61,0.3); }
        .param-range { display: flex; justify-content: space-between; font-size: 0.68rem; color: #444; margin-top: 3px; }

        /* Presets */
        .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
        .preset { padding: 8px 4px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #aaa; font-size: 0.72rem; text-align: center; cursor: pointer; transition: all 0.2s; }
        .preset:hover, .preset.active { background: rgba(255,217,61,0.12); border-color: #ffd93d; color: #ffd93d; }

        .p-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.06); }
        .btn-row { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-rec { background: linear-gradient(135deg, #ff4444, #cc0000); color: white; }
        .btn-rec:disabled { opacity: 0.5; }
        .btn-dl { background: rgba(255,255,255,0.08); color: #ccc; display: none; }

        #progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, #ffd93d, #ff6b9d); z-index: 25; transition: width 0.1s; width: 0%; }
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; z-index: 30; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        #toast.show { opacity: 1; }

        @media (max-width: 480px) { #panel { width: 100vw; } }
    </style>
</head>
<body>
    <div id="progress"></div>
    <div id="toast"></div>
    <canvas id="c"></canvas>
    <button id="toggle" onclick="togglePanel()">⚙</button>

    <div id="panel">
        <div class="p-header">
            <h2>物理シミュレーション</h2>
            <p>オブジェクトと物理パラメータを選択</p>
        </div>
        <div class="p-body">
            <div class="section-label">タイプ選択</div>
            <div class="type-row">
                <div class="type-btn active" data-type="egg" onclick="setType(this)">
                    <span class="icon">🥚</span>卵
                </div>
                <div class="type-btn" data-type="bubble" onclick="setType(this)">
                    <span class="icon">🫧</span>シャボン玉
                </div>
                <div class="type-btn" data-type="ball" onclick="setType(this)">
                    <span class="icon">⚽</span>ボール
                </div>
            </div>

            <div class="section-label">プリセット</div>
            <div class="presets">
                <div class="preset active" onclick="applyPreset('bounce')">弾む</div>
                <div class="preset" onclick="applyPreset('float')">浮遊</div>
                <div class="preset" onclick="applyPreset('drop')">落下</div>
                <div class="preset" onclick="applyPreset('pool)">プール</div>
                <div class="preset" onclick="applyPreset('chaos)">カオス</div>
                <div class="preset" onclick="applyPreset('gentle')">優しい</div>
            </div>

            <div class="section-label">物理パラメータ</div>

            <div class="param">
                <div class="param-top">
                    <span class="param-label">📦 数</span>
                    <span class="param-val" id="v-count">8</span>
                </div>
                <input type="range" id="s-count" min="1" max="30" step="1" value="8" oninput="onParam()">
                <div class="param-range"><span>1</span><span>30</span></div>
            </div>

            <div class="param">
                <div class="param-top">
                    <span class="param-label">⚖️ 重力</span>
                    <span class="param-val" id="v-gravity">9.8</span>
                </div>
                <input type="range" id="s-gravity" min="0" max="30" step="0.5" value="9.8" oninput="onParam()">
                <div class="param-range"><span>宙浮き</span><span>強 gravity</span></div>
            </div>

            <div class="param">
                <div class="param-top">
                    <span class="param-label">🎾 弾性</span>
                    <span class="param-val" id="v-bounce">0.7</span>
                </div>
                <input type="range" id="s-bounce" min="0" max="1" step="0.05" value="0.7" oninput="onParam()">
                <div class="param-range"><span>しんなり</span><span>超弾む</span></div>
            </div>

            <div class="param">
                <div class="param-top">
                    <span class="param-label">🌀 摩擦</span>
                    <span class="param-val" id="v-friction">0.3</span>
                </div>
                <input type="range" id="s-friction" min="0" max="1" step="0.05" value="0.3" oninput="onParam()">
                <div class="param-range"><span>ツルツル</span><span>ベタつき</span></div>
            </div>

            <div class="param">
                <div class="param-top">
                    <span class="param-label">💨 風</span>
                    <span class="param-val" id="v-wind">0.0</span>
                </div>
                <input type="range" id="s-wind" min="-5" max="5" step="0.2" value="0" oninput="onParam()">
                <div class="param-range"><span>← 左</span><span>右 →</span></div>
            </div>

            <div class="param">
                <div class="param-top">
                    <span class="param-label">📐 サイズ</span>
                    <span class="param-val" id="v-size">1.0</span>
                </div>
                <input type="range" id="s-size" min="0.3" max="3" step="0.1" value="1.0" oninput="onParam()">
                <div class="param-range"><span>小さめ</span><span>大きめ</span></div>
            </div>
        </div>

        <div class="p-footer">
            <div class="btn-row">
                <button class="btn btn-rec" id="recBtn" onclick="startRec()">● 録画 15s</button>
                <button class="btn btn-dl" id="dlBtn" onclick="download()">↓ DL</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    (() => {
        'use strict';

        const W = 1080, H = 1920, DUR = 15, FPS = 30;
        const WALL_L = -5, WALL_R = 5, WALL_B = -8, WALL_T = 10;
        const FLOOR_Y = WALL_B;
        const CEIL_Y = WALL_T;

        // ── State ──────────────────────────────────────────────
        let objType = 'egg';
        const P = { count: 8, gravity: 9.8, bounce: 0.7, friction: 0.3, wind: 0, size: 1.0 };

        // ── Physics bodies ─────────────────────────────────────
        let bodies = [];

        class Body {
            constructor(x, y, r, type) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = (Math.random() - 0.5) * 2;
                this.r = r;
                this.mass = r * r;
                this.rot = Math.random() * Math.PI * 2;
                this.rotV = (Math.random() - 0.5) * 2;
                this.type = type;
                this.mesh = null;
                this.phase = Math.random() * Math.PI * 2;
            }
        }

        function typeProps(type) {
            if (type === 'bubble') return { bounce: 0.95, friction: 0.05, mass: 0.1, opacity: 0.35, emissive: 0.3 };
            if (type === 'ball') return { bounce: 0.85, friction: 0.4, mass: 1.5, opacity: 1.0, emissive: 0.0 };
            return { bounce: 0.7, friction: 0.3, mass: 1.0, opacity: 0.9, emissive: 0.1 }; // egg
        }

        // ── Three.js ───────────────────────────────────────────
        const canvas = document.getElementById('c');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a18);

        const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);
        camera.position.set(0, 1, 14);
        camera.lookAt(0, 1, 0);

        // Lights
        scene.add(new THREE.AmbientLight(0x506080, 0.8));
        const dl = new THREE.DirectionalLight(0xffffff, 1.0);
        dl.position.set(4, 10, 8);
        scene.add(dl);
        const pl = new THREE.PointLight(0xff6b9d, 0.5, 20);
        pl.position.set(0, -3, 6);
        scene.add(pl);

        // Floor visual
        const floorGeo = new THREE.PlaneGeometry(14, 1);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x15152a, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.set(0, FLOOR_Y - 0.5, -1);
        scene.add(floor);

        // Wall visual
        const wallGeo = new THREE.PlaneGeometry(1, 22);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x15152a, roughness: 0.8 });
        const wallL = new THREE.Mesh(wallGeo, wallMat);
        wallL.position.set(WALL_L - 0.5, 1, -1);
        scene.add(wallL);
        const wallR = new THREE.Mesh(wallGeo, wallMat);
        wallR.position.set(WALL_R + 0.5, 1, -1);
        scene.add(wallR);

        // Ceiling
        const ceilGeo = new THREE.PlaneGeometry(14, 1);
        const ceil = new THREE.Mesh(ceilGeo, floorMat);
        ceil.position.set(0, CEIL_Y + 0.5, -1);
        scene.add(ceil);

        // ── Mesh builders ──────────────────────────────────────
        function buildEggGeo(r) {
            const h = r * 1.4, segs = 16, v = [], idx = [];
            for (let i = 0; i <= segs; i++) {
                const phi = Math.PI * i / segs;
                for (let j = 0; j < segs; j++) {
                    const th = 2 * Math.PI * j / segs;
                    let R = r, y = h * Math.cos(phi);
                    if (y > 0) R *= 1.0 - (y / h) * 0.25;
                    v.push(R * Math.sin(phi) * Math.cos(th), y, R * Math.sin(phi) * Math.sin(th));
                }
            }
            for (let i = 0; i < segs; i++)
                for (let j = 0; j < segs; j++) {
                    const a = i*segs+j, b = i*segs+(j+1)%segs;
                    const c = (i+1)*segs+(j+1)%segs, d = (i+1)*segs+j;
                    idx.push(a,b,c, a,c,d);
                }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
            geo.setIndex(idx);
            geo.computeVertexNormals();
            return geo;
        }

        function buildSphereGeo(r, detail) {
            return new THREE.SphereGeometry(r, detail || 16, detail || 12);
        }

        function makeMesh(body) {
            const tp = typeProps(body.type);
            let geo, mat;

            if (body.type === 'egg') {
                geo = buildEggGeo(body.r);
                mat = new THREE.MeshStandardMaterial({ color: 0xf5e6d3, roughness: 0.35, metalness: 0.05 });
            } else if (body.type === 'bubble') {
                geo = buildSphereGeo(body.r, 20);
                mat = new THREE.MeshPhysicalMaterial({
                    color: 0x88ccff, transparent: true, opacity: 0.3,
                    roughness: 0, metalness: 0, transmission: 0.8,
                    thickness: 0.5, clearcoat: 1, clearcoatRoughness: 0,
                    envMapIntensity: 1.5,
                });
            } else {
                geo = buildSphereGeo(body.r, 16);
                mat = new THREE.MeshStandardMaterial({ color: 0xff4444, roughness: 0.4, metalness: 0.2 });
            }

            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(body.x, body.y, 0);
            scene.add(mesh);
            body.mesh = mesh;
            return mesh;
        }

        function removeMeshes() {
            bodies.forEach(b => { if (b.mesh) scene.remove(b.mesh); });
            bodies = [];
        }

        function spawnBodies() {
            removeMeshes();
            const { count, size } = P;
            for (let i = 0; i < count; i++) {
                const r = (0.3 + Math.random() * 0.4) * size;
                const x = WALL_L + r + Math.random() * (WALL_R - WALL_L - r * 2);
                const y = WALL_T - r - Math.random() * 6;
                const b = new Body(x, y, r, objType);
                b.vy = -2 - Math.random() * 3;
                bodies.push(b);
                makeMesh(b);
            }
        }

        spawnBodies();

        // ── Physics step ───────────────────────────────────────
        const DT = 1 / 60;

        function physicsStep() {
            const { gravity, bounce, friction, wind } = P;

            for (const b of bodies) {
                const tp = typeProps(b.type);
                const effBounce = bounce * tp.bounce;
                const effFric = friction * tp.friction;
                const effMass = tp.mass;

                // Gravity + wind
                b.vy -= gravity * DT;
                b.vx += wind * DT * 0.5;

                // Air resistance
                b.vx *= 0.999;
                b.vy *= 0.999;

                // Move
                b.x += b.vx * DT;
                b.y += b.vy * DT;

                // Floor
                if (b.y - b.r < FLOOR_Y) {
                    b.y = FLOOR_Y + b.r;
                    b.vy = -b.vy * effBounce;
                    b.vx *= (1 - effFric * 0.1);
                    b.rotV += b.vx * 0.1;
                }
                // Ceiling
                if (b.y + b.r > CEIL_Y) {
                    b.y = CEIL_Y - b.r;
                    b.vy = -b.vy * effBounce;
                }
                // Walls
                if (b.x - b.r < WALL_L) {
                    b.x = WALL_L + b.r;
                    b.vx = -b.vx * effBounce;
                    b.rotV += b.vy * 0.05;
                }
                if (b.x + b.r > WALL_R) {
                    b.x = WALL_R - b.r;
                    b.vx = -b.vx * effBounce;
                    b.rotV -= b.vy * 0.05;
                }

                // Rotation
                b.rot += b.rotV * DT;
                b.rotV *= 0.99;
            }

            // Body-body collisions
            const toRemove = new Set();

            for (let i = 0; i < bodies.length; i++) {
                if (toRemove.has(i)) continue;
                for (let j = i + 1; j < bodies.length; j++) {
                    if (toRemove.has(j)) continue;
                    const a = bodies[i], b = bodies[j];
                    const dx = b.x - a.x, dy = b.y - a.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minD = a.r + b.r;

                    if (dist < minD && dist > 0.001) {
                        const nx = dx / dist, ny = dy / dist;
                        const overlap = minD - dist;
                        const totalMass = a.mass + b.mass;

                        // ── Bubble merge (シャボン玉融合) ──
                        if (a.type === 'bubble' && b.type === 'bubble') {
                            // Larger absorbs smaller
                            const [big, small] = a.r >= b.r ? [a, b] : [b, a];
                            const area = Math.PI * big.r * big.r + Math.PI * small.r * small.r;
                            const newR = Math.sqrt(area / Math.PI); // 面積保存
                            const newMass = big.mass + small.mass;
                            big.r = Math.min(newR, 2.5); // 最大サイズ制限
                            big.mass = newMass;
                            big.vx = (big.vx * big.mass + small.vx * small.mass) / newMass;
                            big.vy = (big.vy * big.mass + small.vy * small.mass) / newMass;
                            big.rotV += small.rotV * 0.3;
                            // Rebuild mesh
                            if (big.mesh) {
                                scene.remove(big.mesh);
                                big.mesh = null;
                                makeMesh(big);
                            }
                            // Mark small for removal
                            if (small.mesh) { scene.remove(small.mesh); small.mesh = null; }
                            toRemove.add(bodies.indexOf(small));
                            continue;
                        }

                        // Separate
                        a.x -= nx * overlap * (b.mass / totalMass);
                        a.y -= ny * overlap * (b.mass / totalMass);
                        b.x += nx * overlap * (a.mass / totalMass);
                        b.y += ny * overlap * (a.mass / totalMass);

                        // ── Ball extra repulsion (ボール反発) ──
                        const isBallCollision = a.type === 'ball' && b.type === 'ball';

                        // Elastic collision
                        const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
                        const dvn = dvx * nx + dvy * ny;

                        if (dvn > 0) {
                            const effB = isBallCollision
                                ? P.bounce * 1.5  // ボールは強く反発
                                : (P.bounce * typeProps(a.type).bounce + P.bounce * typeProps(b.type).bounce) / 2;
                            const imp = (1 + effB) * dvn / totalMass;
                            a.vx -= imp * b.mass * nx;
                            a.vy -= imp * b.mass * ny;
                            b.vx += imp * a.mass * nx;
                            b.vy += imp * a.mass * ny;

                            // ボールは追加の反発力
                            if (isBallCollision) {
                                const repel = 3.0;
                                a.vx -= nx * repel;
                                a.vy -= ny * repel;
                                b.vx += nx * repel;
                                b.vy += ny * repel;
                            }

                            a.rotV += (nx + ny) * 0.5;
                            b.rotV -= (nx + ny) * 0.5;
                        }
                    }
                }
            }

            // Remove merged bodies
            if (toRemove.size > 0) {
                const sorted = [...toRemove].sort((a, b) => b - a);
                for (const idx of sorted) bodies.splice(idx, 1);
            }
        }

        // ── Animate ────────────────────────────────────────────
        let colorTime = 0;

        function animate(t) {
            colorTime = t / 1000;

            // Multiple sub-steps for stability
            for (let s = 0; s < 3; s++) physicsStep();

            // Sync meshes
            for (const b of bodies) {
                if (!b.mesh) continue;
                b.mesh.position.x = b.x;
                b.mesh.position.y = b.y;
                b.mesh.rotation.z = b.rot;

                if (b.type === 'bubble') {
                    b.mesh.material.opacity = 0.25 + Math.sin(colorTime * 2 + b.phase) * 0.1;
                    b.mesh.material.color.setHSL(
                        (colorTime * 0.1 + b.phase / Math.PI / 2) % 1, 0.6, 0.7
                    );
                } else if (b.type === 'ball') {
                    b.mesh.material.color.setHSL(
                        (colorTime * 0.15 + b.phase / Math.PI / 2) % 1, 0.8, 0.55
                    );
                } else {
                    // egg - subtle
                    b.mesh.material.color.setHSL(
                        (0.08 + Math.sin(colorTime * 0.3 + b.phase) * 0.05), 0.5, 0.75
                    );
                }
            }

            // Camera sway
            camera.position.x = Math.sin(colorTime * 0.2) * 0.5;
            camera.position.y = 1 + Math.sin(colorTime * 0.15) * 0.4;

            // Background
            scene.background.setHSL((colorTime * 0.015) % 1, 0.3, 0.05);
            pl.color.setHSL((colorTime * 0.03 + 0.5) % 1, 0.7, 0.5);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // ── UI ─────────────────────────────────────────────────
        window.setType = function(el) {
            objType = el.dataset.type;
            document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            spawnBodies();
            toast(el.textContent.trim() + 'に変更');
        };

        window.onParam = function() {
            const keys = ['count', 'gravity', 'bounce', 'friction', 'wind', 'size'];
            let needRespawn = false;
            keys.forEach(k => {
                const el = document.getElementById('s-' + k);
                const v = parseFloat(el.value);
                const vEl = document.getElementById('v-' + k);
                if (k === 'count') { vEl.textContent = Math.round(v); if (P.count !== Math.round(v)) needRespawn = true; }
                else vEl.textContent = v.toFixed(k === 'bounce' || k === 'friction' ? 2 : 1);
                P[k] = v;
            });
            if (needRespawn) spawnBodies();
        };

        window.togglePanel = function() {
            document.getElementById('panel').classList.toggle('open');
        };

        const presetData = {
            bounce: { count: 10, gravity: 9.8, bounce: 0.9, friction: 0.1, wind: 0, size: 0.8 },
            float:  { count: 8, gravity: 1.0, bounce: 0.6, friction: 0.05, wind: 0.5, size: 1.0 },
            drop:   { count: 15, gravity: 20, bounce: 0.3, friction: 0.5, wind: 0, size: 0.6 },
            pool:   { count: 20, gravity: 5, bounce: 0.5, friction: 0.8, wind: 0, size: 0.5 },
            chaos:  { count: 25, gravity: 15, bounce: 0.95, friction: 0.1, wind: 3, size: 0.5 },
            gentle: { count: 5, gravity: 3, bounce: 0.4, friction: 0.6, wind: 0.2, size: 1.5 },
        };

        window.applyPreset = function(name) {
            const p = presetData[name];
            if (!p) return;
            Object.entries(p).forEach(([k, v]) => {
                document.getElementById('s-' + k).value = v;
            });
            onParam();
            document.querySelectorAll('.preset').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            toast(name.toUpperCase());
        };

        // ── Recording ──────────────────────────────────────────
        let recordedBlob = null;

        window.startRec = async function() {
            const btn = document.getElementById('recBtn');
            const bar = document.getElementById('progress');
            btn.textContent = '● 録画中...';
            btn.disabled = true;
            bar.style.width = '0%';

            const origW = window.innerWidth, origH = window.innerHeight;
            renderer.setSize(W, H);
            camera.aspect = W / H;
            camera.updateProjectionMatrix();

            const stream = canvas.captureStream(FPS);
            const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
            const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 });
            const chunks = [];
            rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            const done = new Promise(res => { rec.onstop = () => res(new Blob(chunks, { type: 'video/webm' })); });
            rec.start();

            const start = performance.now();
            await new Promise(resolve => {
                (function loop() {
                    const t = (performance.now() - start) / 1000;
                    bar.style.width = Math.min(t / DUR * 100, 100) + '%';
                    if (t >= DUR) { rec.stop(); resolve(); }
                    else requestAnimationFrame(loop);
                })();
            });

            recordedBlob = await done;
            renderer.setSize(origW, origH);
            camera.aspect = origW / origH;
            camera.updateProjectionMatrix();

            btn.textContent = '● 録画 15s';
            btn.disabled = false;
            document.getElementById('dlBtn').style.display = 'inline-block';
            toast('完了！ ' + (recordedBlob.size / 1024 / 1024).toFixed(1) + 'MB');
        };

        window.download = function() {
            if (!recordedBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(recordedBlob);
            a.download = 'egg_physics_' + Date.now() + '.webm';
            a.click();
        };

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        }

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        if (window.innerWidth < 600) document.getElementById('panel').classList.add('open');
    })();
    </script>
</body>
</html>
